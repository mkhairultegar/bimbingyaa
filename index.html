<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThesisTrack — Sistem Manajemen Skripsi</title>
  <meta name="description" content="Platform manajemen skripsi berbasis web dengan fitur realtime chat, tracking status, dan kolaborasi tim.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase SDKs (compat version — lebih mudah digunakan tanpa bundler) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- ================================================
       ROOT APP — Semua halaman di-render ke sini
       ================================================ -->
  <div id="app">
    <!-- Konten diisi oleh JavaScript -->
  </div>

  <!-- ================================================
       JAVASCRIPT — Urutan load PENTING!
       1. firebase-config (inisialisasi firebase)
       2. auth (halaman login/register)
       3. dashboard (panel utama)
       4. project-detail (detail & chat proyek)
       5. app (entry point & auth state observer)
       ================================================ -->
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/project-detail.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
